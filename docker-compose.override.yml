services:
  web_frontend:
    build:
      context: ./services/web_frontend
      target: build
    # Запускаем dev-сервер Vite (HMR) вместо сборки статики
    command: npm run dev -- --host 0.0.0.0 --port 80
    volumes:
      # Монтируем исходный код фронтенда напрямую в контейнер
      - ./services/web_frontend:/app
      # Изолируем node_modules в анонимном томе, чтобы локальная папка 
      # не затирала установленные внутри контейнера пакеты
      - /app/node_modules
