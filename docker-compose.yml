
services:
  db:
    image: postgres:15-alpine
    container_name: smart_contacts_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-smart_contacts}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-smart_contacts}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_net

  redis:
    image: redis:7-alpine
    container_name: smart_contacts_redis
    restart: always
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - smart_net

  api_gateway:
    build:
      context: .
      dockerfile: services/api_gateway/Dockerfile
    container_name: smart_contacts_api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./certs:/app/certs:ro
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "127.0.0.1:8001:8000"
    dns:
      - 10.244.0.11
      - 8.8.8.8
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smart_net

  ad_sync_worker:
    build:
      context: .
      dockerfile: services/ad_sync_worker/Dockerfile
    container_name: smart_contacts_worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./docs:/app/docs:ro
      - ./certs:/app/certs:ro
    dns:
      - 10.244.0.11
    healthcheck:
      test: ["CMD-SHELL", "uv run python -c \"from app.db import SessionLocal; from sqlalchemy import text; s = SessionLocal(); s.execute(text('SELECT 1')); s.close()\""]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - smart_net

  web_frontend:
    image: smart-contacts-web_frontend
    build:
      context: ./services/web_frontend
      dockerfile: Dockerfile
    container_name: smart_contacts_web
    restart: always
    volumes:
      - ./certs:/etc/nginx/certs
      - ./services/web_frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - api_gateway
    networks:
      - smart_net

  node_exporter:
    image: prom/node-exporter:v1.7.0
    container_name: smart_contacts_node_exporter
    restart: always
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - smart_net

  postgres_exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: smart_contacts_postgres_exporter
    restart: always
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_password}@db:5432/${POSTGRES_DB:-smart_contacts}?sslmode=disable"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - smart_net

  redis_exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: smart_contacts_redis_exporter
    restart: always
    environment:
      - REDIS_ADDR=redis:6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - smart_net

networks:
  smart_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.10.0/24

volumes:
  postgres_data:

